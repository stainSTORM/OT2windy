[project]
name = "ot2windy"
version = "0.1.0"
description = "Driver for the Opentrons OT-2 to connect as an agent to arktitekt-next"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arkitekt-next>=0.42",
    "fastapi>=0.123.9",
    "requests>=2.32.5",
    "uvicorn>=0.38.0",
]

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"
