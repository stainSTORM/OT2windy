name: docker

# Builds ghcr.io/stainstorm/ot2windy for the Raspberry Pi (arm64) and PCs (amd64).
# Every push to a branch publishes a sha-<commit> tag (pull requests only build), which the
# openUC2 OS pallet (github.com/openUC2/os-rpi, deployments/opentrons.pkg) pins.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  # A PR's own branch push already published its commit; a PR run's sha would be the merge commit.
  PUSH_IMAGE: ${{ github.event_name != 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Lowercase image name
        id: image
        uses: ASzc/change-string-case-action@v8
        with:
          string: ghcr.io/${{ github.repository }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.lowercase }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: ${{ env.PUSH_IMAGE == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
